<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raider Planner - Live Course Search</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2" />
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="logo">⚡ Raider Planner</div>
    <div class="nav-links">
      <a href="/">Calendar</a>
      <a href="/search" class="active">Course Search</a>
      <a href="/social">Class Connect</a>
      <a href="/plans">Plans & Export</a>
      <a href="/degree-map">Degree Roadmap</a>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>Live Course Search</h1>
      <p>Search TTU's public catalog by Term, Subject, Course Number, or CRN.</p>
    </header>

    <!-- Search Box Container using .search-box-card and .search-inputs -->
    <div class="search-box-card">
  <div class="search-inputs">
    <!-- Term Filter -->
    <select id="term-filter" onchange="onTermChange()">
      <option value="">Loading terms...</option>
    </select>

    <!-- NEW: Subject Search Input with Datalist -->
    <input 
      list="dept-options" 
      id="dept-filter" 
      placeholder="Type subject (e.g., CS)..." 
      oninput="onSubjectSelectInput()"
    />
    <datalist id="dept-options">
      <!-- Options populated dynamically by JS -->
    </datalist>

    <!-- Search Query Input -->
    <input 
      type="text" 
      id="search-query" 
      placeholder="Search CS 1412, Data Structures, or CRN..." 
      oninput="onSearchInput()"
    />

    <button onclick="performSearch(1)">Search Classes</button>
  </div>
</div>

    <!-- Results Count Header -->
    <div id="results-summary" style="margin-bottom: 1rem; color: var(--text-muted); font-weight: 500; display: none;">
      Showing <span id="current-count" style="color: var(--text-primary); font-weight: bold;">0</span> of <span id="total-count" style="color: var(--text-primary); font-weight: bold;">0</span> courses
    </div>

    <!-- Course Cards Grid using .results-grid -->
    <div id="results-grid" class="results-grid">
      <p style="color: var(--text-muted); grid-column: 1/-1;">Select a term and department above to search courses.</p>
    </div>

    <!-- Pagination Controls -->
    <div id="pagination-controls" style="display: none; justify-content: center; align-items: center; gap: 1rem; margin-top: 2rem; padding-bottom: 2rem;">
      <button id="prev-page-btn" onclick="changePage(-1)" disabled>&larr; Previous</button>
      <span id="page-indicator" style="color: var(--text-muted); font-size: 0.9rem;">Page 1 of 1</span>
      <button id="next-page-btn" onclick="changePage(1)" disabled>Next &rarr;</button>
    </div>
  </main>

  <script src="/static/js/search.js?v=3"></script>
  <script src="/static/js/ai-widget.js"></script>
</body>
</html>
