<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raider Planner - Calendar Workspace</title>
  
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css?v=3" />
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="logo">⚡ Raider Planner</div>
    <div class="nav-links">
      <a href="/" class="active">Calendar</a>
      <a href="/search">Course Search</a>
      <a href="/social">Class Connect</a>
      <a href="/plans">Plans & Export</a>
      <a href="/degree-map">Degree Roadmap</a>
    </div>
  </nav>

  <!-- Main Workspace -->
  <main class="app-layout">
    <!-- Sidebar: Saved CRNs & Tools -->
    <aside class="sidebar">
      <h2>Active Schedule</h2>
      <div id="creditHourTally" class="credit-banner">
        Hours: <span id="totalHours">0</span> / 12 (Full-Time)
      </div>

      <div class="quick-add">
        <input type="text" id="quickCrnInput" placeholder="Enter 5-digit CRN..." maxlength="5" />
        <button id="addCrnBtn" onclick="addCrnFromSidebar()">+ Add CRN</button>
      </div>

      <ul id="activeCrnList" class="crn-list">
        <!-- Active CRN cards injected dynamically -->
      </ul>

      <button id="addEventBtn" class="action-btn" onclick="openCustomEventModal()">+ Add Custom Exam/Event</button>
    </aside>

    <!-- Main Calendar Area -->
    <section class="calendar-container">
      <div id="calendar"></div>
    </section>
  </main>

  <!-- Clean Floating Custom Personal Event Modal -->
  <div id="customEventModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Custom Event</h3>
        <button class="close-btn" onclick="closeCustomEventModal()">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label for="customTitle">Event Name</label>
          <input type="text" id="customTitle" placeholder="e.g., CS 2413 Midterm 1" required />
        </div>

        <div class="form-group">
          <label for="customColor">Event Type / Color</label>
          <select id="customColor">
            <option value="#D97706">Exam / Quiz (Orange)</option>
            <option value="#2563EB">Personal / Study (Blue)</option>
            <option value="#059669">Work / Extra (Green)</option>
            <option value="#DC2626">Deadline (Red)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="customStart">Start Time</label>
            <input type="datetime-local" id="customStart" required />
          </div>
          <div class="form-group">
            <label for="customEnd">End Time</label>
            <input type="datetime-local" id="customEnd" required />
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeCustomEventModal()">Cancel</button>
        <button class="btn-save" onclick="saveCustomEvent()">Save Event</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="/static/js/script.js"></script>
  <script src="/static/js/ai-widget.js"></script>
  <script src="/static/js/calendar.js?v=1"></script>
</body>
</html>
